[project]
name = "mini-me"
version = "0.1.0"
description = "Mini Me: the twin that earns the right to act (v0.1 foundation)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",   # time zone data for IST display (the slim Docker image has none)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.drafting" = ["prompts/*/*.md", "prompts/README.md"]
"app.classifier" = ["prompts/*/*.md", "prompts/README.md"]
"app.web" = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

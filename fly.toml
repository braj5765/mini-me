# app name is set by `fly launch --no-deploy --copy-config` (pick a unique name, region sin)
primary_region = "sin"

[build]

[env]
  APP_ENV = "prod"
  APP_VERSION = "0.1.0"

[deploy]
  release_command = "python -m app.migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
